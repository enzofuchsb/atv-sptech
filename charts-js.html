<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #000;
      color: #f5f5f5;
      padding: 32px 20px;
    }
    h1 {
      text-align: center;
      font-size: 34px;
      margin-bottom: 6px;
      color: #ff7a00;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .subtitulo {
      text-align: center;
      color: #a3a3a3;
      margin-bottom: 32px;
    }
    .dashboard {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
    }
    .card {
      background: #141414;
      border: 1px solid #ff7a00;
      border-radius: 10px;
      padding: 20px;
      flex: 1 1 420px;
      max-width: 640px;
    }
    .card h2 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #ff7a00;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <h1>Cog Solutions</h1>
  <p class="subtitulo">Temperatura (°C) e Umidade (%)</p>

  <div class="dashboard">
    <div class="card">
      <h2>Por horário</h2>
      <canvas id="graficoLinhas"></canvas>
    </div>

    <div class="card">
      <h2>Médias mensais</h2>
      <canvas id="graficoBarras"></canvas>
    </div>
  </div>

  <script>
  let laranja = '#ff7a00';
  let branco = '#ffffff';

  Chart.defaults.color = '#d4d4d4';
  Chart.defaults.borderColor = '#2a2a2a';

  // Gráfico de Linhas
  new Chart(document.getElementById('graficoLinhas'), {
    type: 'line',
    data: {
      labels: ['12:00', '13:00', '14:00', '15:00', '16:00', '17:00'],
      datasets: [
        { label: 'Temperatura', data: [30, 29, 28, 25, 22, 23], borderColor: laranja, backgroundColor: laranja },
        { label: 'Umidade', data: [80, 82, 80, 85, 80, 83], borderColor: branco, backgroundColor: branco }
      ]
    }
  });

  // Gráfico de Barras
  new Chart(document.getElementById('graficoBarras'), {
    type: 'bar',
    data: {
      labels: ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho'],
      datasets: [
        { label: 'Temperatura Média', data: [22, 24, 27, 23, 20, 18], backgroundColor: laranja },
        { label: 'Umidade Média', data: [90, 89, 93, 87, 88, 82], backgroundColor: branco }
      ]
    }
  });
  </script>
</body>
</html>
